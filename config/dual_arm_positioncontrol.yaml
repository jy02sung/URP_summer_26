dual_arm:
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 1000

  # Mission 3: effort interface 위에서 동작하는 PD position controller.
  # 적분항은 사용하지 않으며 새 X축 손목은 가장 낮은 대역폭으로 시작한다.
  joint1_position_controller:  {type: effort_controllers/JointPositionController, joint: Waist_joint,            pid: {p: 10.0, i: 0.0, d: 2.0}}
  joint2_position_controller:  {type: effort_controllers/JointPositionController, joint: L_shoulder_pitch_joint, pid: {p: 20.0, i: 0.0, d: 4.0}}
  joint3_position_controller:  {type: effort_controllers/JointPositionController, joint: L_shoulder_roll_joint,  pid: {p: 20.0, i: 0.0, d: 4.0}}
  joint4_position_controller:  {type: effort_controllers/JointPositionController, joint: L_shoulder_yaw_joint,   pid: {p: 20.0, i: 0.0, d: 4.0}}
  joint5_position_controller:  {type: effort_controllers/JointPositionController, joint: L_elbow_joint,          pid: {p: 20.0, i: 0.0, d: 4.0}}
  joint6_position_controller:  {type: effort_controllers/JointPositionController, joint: L_wrist_yaw_joint,      pid: {p: 1.0, i: 0.0, d: 0.2}}
  joint7_position_controller:  {type: effort_controllers/JointPositionController, joint: L_wrist_pitch_joint,    pid: {p: 1.0, i: 0.0, d: 0.2}}
  joint8_position_controller:  {type: effort_controllers/JointPositionController, joint: R_shoulder_pitch_joint, pid: {p: 20.0, i: 0.0, d: 4.0}}
  joint9_position_controller:  {type: effort_controllers/JointPositionController, joint: R_shoulder_roll_joint,  pid: {p: 20.0, i: 0.0, d: 4.0}}
  joint10_position_controller: {type: effort_controllers/JointPositionController, joint: R_shoulder_yaw_joint,   pid: {p: 20.0, i: 0.0, d: 4.0}}
  joint11_position_controller: {type: effort_controllers/JointPositionController, joint: R_elbow_joint,          pid: {p: 20.0, i: 0.0, d: 4.0}}
  joint12_position_controller: {type: effort_controllers/JointPositionController, joint: R_wrist_yaw_joint,      pid: {p: 1.0, i: 0.0, d: 0.2}}
  joint13_position_controller: {type: effort_controllers/JointPositionController, joint: R_wrist_pitch_joint,    pid: {p: 1.0, i: 0.0, d: 0.2}}
  joint14_position_controller: {type: effort_controllers/JointPositionController, joint: Head_yaw_joint,         pid: {p: 1.0, i: 0.0, d: 0.2}}
  joint15_position_controller: {type: effort_controllers/JointPositionController, joint: Head_pitch_joint,       pid: {p: 10.0, i: 0.0, d: 2.0}}
